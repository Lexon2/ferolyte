name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # package-lock.json is not committed (see .gitignore), so `npm ci` and the npm cache are not usable.
      - run: npm install --no-audit --no-fund
      # Generated SDK types/validators must match the pinned schemas + patches.
      # Also fetches the schema/sample caches used by the schema and round-trip tests below.
      - run: npm run codegen:check
      - run: npx tsc -p packages/pack/tsconfig.json --noEmit
      - run: npx tsc -p packages/common/tsconfig.json --noEmit
      - run: npx vitest run
